plugins { id 'com.android.application' }

android {
    namespace 'io.github.alondero.worlddriverchampionshiprecomp'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.alondero.worlddriverchampionshiprecomp'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}
