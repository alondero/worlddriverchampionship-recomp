name: Build and release

# Manual release workflow. The copyrighted ROM is checked out from a private
# companion repository, used only during translation, and removed before the
# package is assembled. Configure ROM_ASSETS_REPO and ROM_ASSETS_PAT first.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
      draft:
        description: "Create as a draft"
        type: boolean
        default: true

permissions:
  contents: write

env:
  ROM_FILENAME: "World Driver Championship (USA).z64"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build python3 pkg-config libsdl2-dev libvulkan-dev libfreetype-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libdbus-1-dev
      - name: Fetch private ROM
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ROM_ASSETS_REPO }}
          token: ${{ secrets.ROM_ASSETS_PAT }}
          path: rom-assets
      - name: Place ROM
        run: cp "rom-assets/$ROM_FILENAME" "$ROM_FILENAME"
      - name: Build
        run: bash build.sh
      - name: Remove ROM
        if: always()
        run: rm -f "$ROM_FILENAME" && rm -rf rom-assets
      - name: Package
        run: |
          mkdir -p dist
          cp build/worlddriverchampionship_modern dist/
          cp -r build/assets dist/ 2>/dev/null || true
          cd dist
          zip -r ../worlddriverchampionship-recomp-linux-x64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: worlddriverchampionship-linux-x64
          path: worlddriverchampionship-recomp-linux-x64.zip
