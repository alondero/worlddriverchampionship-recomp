name: Documentation and source-only checks

on:
  push:
    paths:
      - "**/*.md"
      - "scripts/check_docs.py"
      - "tests/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check_docs.py"
      - "tests/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: git diff --check HEAD~1
      - run: python -B scripts/check_docs.py
      - run: python -m unittest discover tests
